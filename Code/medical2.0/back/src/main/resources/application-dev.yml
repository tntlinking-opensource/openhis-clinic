server:
  port: 7016

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/md_yzs?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password_here}
  cache:
    type: none
  redis:
    host: ${REDIS_HOST:127.0.0.1} # server host
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

jwtUtils:
  id: jwt
  secret: ${JWT_SECRET:your_jwt_secret_here}
  ttlMillis: 36000000
