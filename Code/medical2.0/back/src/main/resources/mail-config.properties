# send mails via SMTP
mail.transport.protocol=smtp
mail.smtp.host=${MAIL_SMTP_HOST:smtphz.qiye.163.com}
mail.smtp.port=465
mail.smtp.auth=true
mail.smtp.ssl.enable=true
mail.smtp.socketFactory.port=25
mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# poll mails via IMAPS
# mail.store.protocol=imaps
# mail.imaps.host=imap.gmail.com
# mail.imaps.port=993
# mail.imaps.timeout=10000
# mail.poll.folder=INBOX

mail.sender=${MAIL_SENDER:your_sender@example.com}
mail.sender.alias=${MAIL_SENDER_ALIAS:OpenHis}

mail.attachment.download=false
mail.attachment.path=attachments

# credentials
mail.user=${MAIL_USER:your_email@example.com}
mail.password=${MAIL_PASSWORD:your_email_password}